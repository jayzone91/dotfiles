[main]
font=JetBrainsMono Nerd Font:size=14
dpi-aware=auto
prompt="  "
placeholder=Suche…
icon-theme=Papirus-Dark
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
terminal=ghostty
lines=12
width=55
horizontal-pad=24
vertical-pad=18
inner-pad=10
image-size-ratio=0.45
line-height=28
letter-spacing=0
layer=overlay
exit-on-keyboard-focus-loss=yes
match-mode=fzf
sort-result=yes
show-actions=yes

[colors]
background=1e1e2ef2
text=cdd6f4ff
prompt=cba6f7ff
placeholder=6c7086ff
input=cdd6f4ff
match=f5c2e7ff
selection=313244ff
selection-text=cdd6f4ff
selection-match=cba6f7ff
counter=6c7086ff
border=cba6f7cc

[border]
width=2
radius=18
selection-radius=10

[dmenu]
exit-immediately-if-empty=yes