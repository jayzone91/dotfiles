# Clipse GUI Configuration File
# Settings here override the application defaults.

[General]
clipse_dir = ~/.config/clipse
history_filename = clipboard_history.json
enter_to_paste = False
compact_mode = False
protect_pinned_items = False
hover_to_select = False
highlight_search = True
save_debounce_ms = 300
search_debounce_ms = 250
paste_simulation_delay_ms = 150
minimize_to_tray = True
tray_items_count = 20
tray_paste_on_select = True
open_links_with_browser = True
preview_rich_content = True
clear_search_on_escape = True

[Style]
border_radius = 18
accent_color = #cba6f7
selection_color = #cdd6f4
selection_bg_color = #313244
hover_color = #cdd6f4
hover_bg_color = #45475a
visual_mode_color = #a29bfe
background_transparent = True

[Commands]
copy_tool_cmd = wl-copy
x11_copy_tool_cmd = xclip -i -selection clipboard
paste_simulation_cmd_wayland = wtype -M ctrl -P v -p v -m ctrl
paste_simulation_cmd_x11 = xdotool key --clearmodifiers ctrl+v

[UI]
default_window_width = 700
default_window_height = 850
default_preview_text_width = 900
default_preview_text_height = 700
default_preview_img_width = 700
default_preview_img_height = 450
default_help_width = 550
default_help_height = 550
list_item_image_width = 200
list_item_image_height = 100

[Performance]
initial_load_count = 30
load_batch_size = 20
load_threshold_factor = 0.95
image_cache_max_size = 50

